name: web-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SQLITE_WASM_VERSION: 3.54.1-build1
  EXPO_NO_TELEMETRY: '1'
  CI: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Clone web tooling
        run: |
          git clone --depth 1 https://github.com/jq470/cherry-studio-web.git /tmp/tooling
          cp -a /tmp/tooling/scripts .
          cp -a /tmp/tooling/overlay/web web-adaptation
          cp -a /tmp/tooling/overlay/src/web-shims src/web-shims

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Patch web configuration
        run: |
          node scripts/patch-app-config.js app.json
          node scripts/patch-metro.js metro.config.js

      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist-web

      - name: Inject boot gate
        run: node scripts/patch-index-html.js dist-web

      - name: Vendor SQLite WASM runtime
        run: |
          mkdir -p dist-web/sqlite3
          base="https://cdn.jsdelivr.net/npm/@sqlite.org/sqlite-wasm@${SQLITE_WASM_VERSION}/dist"
          for f in index.mjs sqlite3.wasm; do
            curl -fsSL -o "dist-web/sqlite3/$f" "$base/$f" \
              || curl -fsSL -o "dist-web/sqlite3/$f" "https://unpkg.com/@sqlite.org/sqlite-wasm@${SQLITE_WASM_VERSION}/dist/$f"
            test -s "dist-web/sqlite3/$f"
          done

      - name: Static server and assertions
        run: |
          node web-adaptation/static-server.js dist-web 8099 > /tmp/static.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8099/ && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8099/ > /tmp/index.html
          grep -q 'cherry-web-gate' /tmp/index.html
          test -s dist-web/sqlite3/index.mjs

      - name: Install browser
        run: |
          mkdir -p /tmp/driver
          printf '{"name":"driver","private":true}\n' > /tmp/driver/package.json
          cd /tmp/driver
          pnpm add puppeteer-core@24
          ln -sfn /tmp/driver/node_modules/puppeteer-core "$GITHUB_WORKSPACE/node_modules/puppeteer-core"

      - name: Runtime smoke
        env:
          SMOKE_URL: http://127.0.0.1:8099/
          SMOKE_REPORT: ${{ github.workspace }}/RUNTIME-SMOKE.md
        run: node scripts/runtime-smoke.mjs || true

      - name: Chat end-to-end
        env:
          E2E_URL: http://127.0.0.1:8100/?e2e=1
          E2E_REPORT: ${{ github.workspace }}/CHAT-E2E.md
          REGISTRY_DATA_DIR: ${{ github.workspace }}/node_modules/@cherrystudio/provider-registry/data
        run: |
          cp -a dist-web /tmp/e2e-dist
          node scripts/fake-openai.mjs > /tmp/fake.log 2>&1 &
          node scripts/e2e-server.mjs --static /tmp/e2e-dist --port 8100 > /tmp/e2e-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8100/api.deepseek.com/v1/models && break; sleep 1; done
          node scripts/chat-e2e.mjs || true

      - name: Package bundle
        if: always()
        run: |
          (cd dist-web && zip -qr ../cherry-studio-web.zip .) || true
          ls -lh cherry-studio-web.zip CHAT-E2E.md 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-web
          path: dist-web
          if-no-files-found: warn

      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-${{ github.run_id }}
          name: Cherry Studio Web ${{ github.run_id }}
          make_latest: true
          files: |
            cherry-studio-web.zip
            CHAT-E2E.md
            RUNTIME-SMOKE.md

      - name: Commit reports
        if: always()
        run: |
          git config user.name 'web-ci'
          git config user.email 'web-ci@users.noreply.github.com'
          git add CHAT-E2E.md RUNTIME-SMOKE.md CHAT-E2E-FAILURE.png 2>/dev/null || true
          git commit -m 'ci: web build report [skip ci]' || echo 'no report changes'
          git push origin HEAD:main || echo 'report push skipped'
